name: FUI-AS CI

on:
  push:
    branches: [main]
    paths: &fui_as_ci_inputs
      - '.github/workflows/fui-as-ci.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'eslint.config.ts'
      - 'scripts/ci/**'
      - 'v2/abi/**'
      - 'v2/core/include/**'
      - 'v2/ui/include/**'
      - 'v2/fui-as/**'
  pull_request:
    paths: *fui_as_ci_inputs

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: v2/fui-as/package-lock.json
      - name: Resolve the current runtime release
        id: runtime
        run: |
          runtime_version="$(npm view @effindomv2/runtime dist-tags.latest)"
          node -e "if (!/^\\d+\\.\\d+\\.\\d+(?:-[0-9A-Za-z.-]+)?$/.test(process.argv[1])) process.exit(1)" "$runtime_version"
          echo "version=$runtime_version" >> "$GITHUB_OUTPUT"
      - name: Pin the tested runtime version
        env:
          RUNTIME_VERSION: ${{ steps.runtime.outputs.version }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const packagePath = 'v2/fui-as/package.json';
          const packageJson = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          packageJson.dependencies['@effindomv2/runtime'] = process.env.RUNTIME_VERSION;
          fs.writeFileSync(packagePath, `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE
      - name: Install dependencies for the tested runtime
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Assert the runtime package is framework-agnostic
        run: |
          node - <<'NODE'
          const runtime = require('./node_modules/@effindomv2/runtime/package.json');
          if (runtime.dependencies?.['@assemblyscript/loader'] !== undefined) {
            throw new Error('@effindomv2/runtime must not depend on @assemblyscript/loader.');
          }
          NODE
      - name: Lint, typecheck, unit test, and build
        run: |
          npm run lint
          npm run typecheck
          npm run test
          npm run build
      - name: Run FUI-AS runtime package boundary smoke
        run: npm run test:runtime-boundary
      - name: Run browser integration tests
        run: npm run test:browser:release-gate
      - name: Record the tested runtime pin
        env:
          RUNTIME_VERSION: ${{ steps.runtime.outputs.version }}
        run: |
          mkdir -p .release-inputs
          node - <<'NODE'
          const fs = require('node:fs');
          fs.writeFileSync('.release-inputs/release-inputs.json', `${JSON.stringify({ runtimeVersion: process.env.RUNTIME_VERSION }, null, 2)}\n`);
          NODE
      - name: Upload FUI-AS release inputs
        uses: actions/upload-artifact@v4
        with:
          name: fui-as-release-inputs
          path: .release-inputs/release-inputs.json
          if-no-files-found: error
          retention-days: 90
