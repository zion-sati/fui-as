name: FUI-AS CI

on:
  push:
    branches: [main]
    paths: &fui_as_ci_inputs
      - '.github/workflows/fui-as-ci.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'update-deps.sh'
      - 'eslint.config.ts'
      - 'scripts/ci/**'
      - 'v2/abi/**'
      - 'v2/core/include/**'
      - 'v2/ui/include/**'
      - 'v2/fui-as/**'
  pull_request:
    paths: *fui_as_ci_inputs

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: v2/fui-as/package-lock.json
      - name: Install committed dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Assert the runtime package is framework-agnostic
        run: |
          node - <<'NODE'
          const runtime = require('./node_modules/@effindomv2/runtime/package.json');
          if (runtime.dependencies?.['@assemblyscript/loader'] !== undefined) {
            throw new Error('@effindomv2/runtime must not depend on @assemblyscript/loader.');
          }
          NODE
      - name: Lint, typecheck, unit test, and build
        run: |
          npm run lint
          npm run typecheck
          npm run test
          npm run build
      - name: Run FUI-AS runtime package boundary smoke
        run: npm run test:runtime-boundary
      - name: Run browser integration tests
        run: npm run test:browser:release-gate
